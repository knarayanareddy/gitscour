name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, arena/* ]
  schedule:
    # Rebuild the site weekly. Data refreshes happen in the backfill workflow,
    # which opens a PR -- see .github/workflows/backfill_123k.yml.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deterministic unit tests, no network: window planner, harvest
      # completeness guarantees, fork-clause emission. pytest is the only
      # Python dependency (the pipeline itself is stdlib-only).
      - name: Install Test Runner
        run: python -m pip install pytest

      - name: Unit Tests (no network)
        run: python -m pytest tests/ -q

      # Deploys are reproducible: this workflow publishes exactly the catalog
      # committed to the branch. It used to run `legacy/harvest_scale.py`
      # here, which rebuilt the Tier-1 fallback index and every Tier-2 shard
      # from `web/public/repos.json`. That file only carried a stale subset of
      # the catalog, so a scheduled deploy silently shrank the deployed shards
      # and emptied their deep-intel fields. Live ingestion now belongs to the
      # backfill workflow, which commits its output instead of mutating a build.
      # (The `repos.json` twin itself was removed in W5 O.4 — `catalog-index.json`
      # is the sole fallback index and the parity check covers it alone.)
      - name: Verify Catalog Integrity
        run: python3 pipeline/verify_catalog.py

      # W5 §5: the zero-LLM constraint is enforced, not just documented —
      # call/import/site forms only, so static lexicons naming providers pass.
      - name: Zero-LLM guardrail
        run: python3 pipeline/check_zero_llm.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      # Undeclared-identifier guard (`no-undef`). Both runtime-breaking bugs
      # this repo shipped were undeclared identifiers in App.jsx (`data` in the
      # packed-index unpack, `minSignal` in the Min Signal slider). `vite build`
      # only parses, and the smoke test cannot reach them because it
      # re-implements App's decode rather than importing it.
      - name: Lint (no-undef guard)
        working-directory: web
        run: npm run lint

      - name: Build Web Explorer
        working-directory: web
        run: npm run build

      # Contract gate over the artefacts that just got built: Tier-1 unpack,
      # star sort/floor, shard coverage, and the lazy Tier-2 modal merge.
      # The smoke test existed but was never wired into CI (review finding #14).
      - name: Smoke Test Built Artefacts
        working-directory: web
        run: npm run smoke

      - name: Install Chromium for Browser Tests
        working-directory: web
        run: |
          set -euo pipefail
          # Playwright's browser CDN and OS package downloads may be unavailable
          # on restricted runners. Use the matching Chromium build from npm.
          browser_dir="$RUNNER_TEMP/gitscour-chromium"
          mkdir -p "$browser_dir/runtime"
          npm install --prefix "$browser_dir" --no-audit --no-fund @sparticuz/chromium@141.0.0
          TMPDIR="$browser_dir/runtime" GITSCOUR_BROWSER_DIR="$browser_dir" \
            AWS_EXECUTION_ENV=AWS_Lambda_nodejs20.x node --input-type=module >> "$GITHUB_ENV" <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { pathToFileURL } from 'node:url';
          const path = process.env.GITSCOUR_BROWSER_DIR + '/node_modules/@sparticuz/chromium/build/esm/index.js';
          const { default: browser } = await import(pathToFileURL(path).href);
          const executable = await browser.executablePath();
          // The bundled fonts.conf targets Lambda's fixed /tmp/fonts path.
          const fonts = process.env.FONTCONFIG_PATH;
          const config = `${fonts}/fonts.conf`;
          await writeFile(config, (await readFile(config, 'utf8')).replaceAll('/tmp/fonts', fonts));
          console.log(`CHROMIUM_PATH=${executable}`);
          console.log(`LD_LIBRARY_PATH=${process.env.LD_LIBRARY_PATH}`);
          console.log(`FONTCONFIG_PATH=${fonts}`);
          JS

      - name: Test the Production Build in Chromium
        working-directory: web
        run: |
          set -euo pipefail
          site=$(mktemp -d)
          ln -s "$PWD/dist" "$site/gitscour"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$site" &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true; rm -rf "$site"' EXIT
          export GITSCOUR_TEST_URL=http://127.0.0.1:4173/gitscour/
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --output /dev/null "$GITSCOUR_TEST_URL"
          npm run test:browser

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
