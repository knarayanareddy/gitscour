name: 123k Repositories Autonomous Backfill

on:
  workflow_dispatch:
    inputs:
      min_stars:
        description: 'Lowest star threshold to enumerate'
        required: true
        default: '500'
  schedule:
    # Runs monthly on the 1st at 00:00 UTC for deep backfill
    - cron: '0 0 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "backfill-123k"
  cancel-in-progress: false

jobs:
  enumerate-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MIN_STARS: ${{ github.event.inputs.min_stars || '500' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fail before harvesting if the harvest guarantees themselves regress:
      # same deterministic, network-free suite as deploy.yml.
      - name: Install Test Runner
        run: python -m pip install pytest

      - name: Unit Tests (no network)
        run: python -m pytest tests/ -q

      # A single job, not a star-window matrix: GitHub truncates every search
      # query at 1,000 results, so the old 12-way matrix could never capture
      # more than ~12,000 records per run and could never share a resume point.
      # The enumerator instead partitions the star continuum into ~180 windows
      # that each fit under that cap and checkpoints each window it finishes.
      - name: Enumerate every repository above the threshold
        env:
          GITHUB_TOKEN: ${{ secrets.BACKFILL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 pipeline/harvest_enumerate.py \
            --min-stars "$MIN_STARS" \
            --output harvest/raw_repos.jsonl \
            --manifest harvest/windows_done.jsonl \
            --concurrency 12 --rps 8

      # W2 §1.6 / review finding #4: rows the sweep could not match (renamed,
      # deleted, star-purged, live-but-unindexed) get resolved against the live
      # API and emitted as a patch, instead of leaving duplicate/stale rows.
      - name: Reconcile stale rows against the live API
        env:
          GITHUB_TOKEN: ${{ secrets.BACKFILL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 pipeline/reconcile_stale_rows.py \
            --packed web/public/catalog-packed.json \
            --harvest harvest/raw_repos.jsonl \
            --out harvest/reconcile.json \
            --min-stars "$MIN_STARS" \
            --concurrency 12

      - name: Classify and rebuild catalog artefacts
        run: |
          python3 pipeline/rebuild_catalog.py \
            --harvest harvest/raw_repos.jsonl \
            --reconcile harvest/reconcile.json \
            --min-stars "$MIN_STARS"

      # W2 §1.3: re-score every label with taxonomy v2 through the shared
      # single-writer units, then gate on churn. --allow-churn because this run
      # is the deliberate v1->v2 migration (the histogram + machine-readable
      # report ship in the harvest-checkpoint artifact as reclassify_report.json);
      # steady-state monthly runs should stay far below the 20% default gate.
      - name: Re-score labels with taxonomy v2 (churn report)
        run: |
          python3 pipeline/reclassify_catalog.py \
            --min-stars "$MIN_STARS" \
            --allow-churn \
            --min-topics-pct 50 \
            --report-out harvest/reclassify_report.json

      # W2 §1.8: ship the 16 curated ELI5 cards inside the regenerated shards
      # (runs after reclassify so it lands in the same reviewable PR).
      - name: Merge curated seed ELI5 cards into shards
        run: python3 pipeline/merge_seed_intel.py --apply

      - name: Verify catalog integrity
        run: python3 pipeline/verify_catalog.py --min-stars "$MIN_STARS"

      # Same contract gate as deploy.yml: this workflow opens a PR that ships
      # regenerated artefacts, so catch a broken Tier-1 decode / Tier-2 lazy-merge
      # contract before the PR exists (review finding #14: the smoke test was in
      # neither workflow). smoke-test.mjs is dependency-free.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test regenerated artefacts
        run: node web/smoke-test.mjs web/public

      - name: Upload harvest checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-checkpoint
          path: harvest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Open backfill pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/public && git diff --cached --quiet -- web/public; then
            echo "No catalog changes detected; nothing to propose."
            exit 0
          fi
          REPO_COUNT=$(python3 -c "import json;print(len(json.load(open('web/public/catalog-packed.json'))['rows']))")
          BRANCH="backfill/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add web/public
          git commit -q -m "data: backfill catalog to ${REPO_COUNT} repositories (>= ${MIN_STARS} stars)"
          git push -u origin "$BRANCH"
          cat > pr_body.md <<EOF
          Automated backfill run for \`${{ github.ref_name }}\` (run \`${{ github.run_id }}\`).

          - Enumerated every repository at or above ${MIN_STARS} stars with \`pipeline/harvest_enumerate.py\`
          - Reconciled stale rows (renames/deletions) via \`pipeline/reconcile_stale_rows.py\`
          - Classified and re-sharded with \`pipeline/rebuild_catalog.py\`
          - Re-scored all labels with \`pipeline/reclassify_catalog.py\` (taxonomy v2) — full churn histogram in the log, machine-readable report in the \`harvest-checkpoint\` artifact (\`reclassify_report.json\`)
          - Tier-1 packed index now holds **${REPO_COUNT}** repositories
          - \`pipeline/verify_catalog.py\` passed on the regenerated artefacts

          Merging deploys the refreshed catalog via \`deploy.yml\`.
          EOF
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "data: backfill catalog to ${REPO_COUNT} repositories" \
            --body-file pr_body.md || true
