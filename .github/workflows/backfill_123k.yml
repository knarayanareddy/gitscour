name: 123k Repositories Autonomous Backfill Matrix

on:
  workflow_dispatch:
    inputs:
      full_crawl:
        description: 'Execute full 123k crawling matrix'
        required: true
        default: 'true'
  schedule:
    # Runs monthly on the 1st at 00:00 UTC for deep backfill
    - cron: '0 0 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "backfill-123k"
  cancel-in-progress: false

jobs:
  harvest-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # 12 parallel star intervals covering the entire 500..500k continuum (<1000 per window)
        window:
          - "stars:>50000"
          - "stars:25000..50000"
          - "stars:15000..25000"
          - "stars:10000..15000"
          - "stars:6500..10000"
          - "stars:4500..6500"
          - "stars:3000..4500"
          - "stars:2000..3000"
          - "stars:1400..2000"
          - "stars:950..1400"
          - "stars:650..950"
          - "stars:500..650"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest Window
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 pipeline/backfill_worker.py --window "${{ matrix.window }}"

      - name: Upload Window Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ strategy.job-index }}
          path: chunk_*.json
          retention-days: 1

  consolidate-and-deploy:
    needs: harvest-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download All Chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks

      - name: Consolidate & Re-Shard
        run: |
          python3 -c "
          import os, glob, json, sys
          sys.path.append('pipeline')
          from shard_manager import build_sharded_dataset

          # Load existing catalog
          existing = []
          if os.path.exists('web/public/repos.json'):
              existing = json.load(open('web/public/repos.json'))

          merged = {r['id']: r for r in existing}
          for f in glob.glob('chunks/**/*.json', recursive=True):
              try:
                  items = json.load(open(f))
                  for it in items:
                      merged[it['id']] = it
              except Exception as e:
                  print('Error reading chunk:', f, e)

          all_repos = sorted(list(merged.values()), key=lambda x: x['stars'], reverse=True)
          print(f'Consolidated total repositories: {len(all_repos)}')
          build_sharded_dataset(all_repos, base_dir='web/public')
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Explorer
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
