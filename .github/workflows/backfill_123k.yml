name: 123k Repositories Autonomous Backfill

on:
  workflow_dispatch:
    inputs:
      min_stars:
        description: 'Lowest star threshold to enumerate'
        required: true
        default: '500'
  schedule:
    # Runs monthly on the 1st at 00:00 UTC for deep backfill
    - cron: '0 0 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "backfill-123k"
  cancel-in-progress: false

jobs:
  enumerate-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MIN_STARS: ${{ github.event.inputs.min_stars || '500' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A single job, not a star-window matrix: GitHub truncates every search
      # query at 1,000 results, so the old 12-way matrix could never capture
      # more than ~12,000 records per run and could never share a resume point.
      # The enumerator instead partitions the star continuum into ~180 windows
      # that each fit under that cap and checkpoints each window it finishes.
      - name: Enumerate every repository above the threshold
        env:
          GITHUB_TOKEN: ${{ secrets.BACKFILL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 pipeline/harvest_enumerate.py \
            --min-stars "$MIN_STARS" \
            --output harvest/raw_repos.jsonl \
            --manifest harvest/windows_done.jsonl \
            --concurrency 12 --rps 8

      - name: Classify and rebuild catalog artefacts
        run: |
          python3 pipeline/rebuild_catalog.py \
            --harvest harvest/raw_repos.jsonl \
            --min-stars "$MIN_STARS"

      - name: Verify catalog integrity
        run: python3 pipeline/verify_catalog.py --min-stars "$MIN_STARS"

      - name: Upload harvest checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-checkpoint
          path: harvest/
          retention-days: 7
          if-no-files-found: ignore

      - name: Open backfill pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/public && git diff --cached --quiet -- web/public; then
            echo "No catalog changes detected; nothing to propose."
            exit 0
          fi
          REPO_COUNT=$(python3 -c "import json;print(len(json.load(open('web/public/catalog-packed.json'))['rows']))")
          BRANCH="backfill/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add web/public
          git commit -q -m "data: backfill catalog to ${REPO_COUNT} repositories (>= ${MIN_STARS} stars)"
          git push -u origin "$BRANCH"
          cat > pr_body.md <<EOF
          Automated backfill run for \`${{ github.ref_name }}\` (run \`${{ github.run_id }}\`).

          - Enumerated every repository at or above ${MIN_STARS} stars with \`pipeline/harvest_enumerate.py\`
          - Classified and re-sharded with \`pipeline/rebuild_catalog.py\`
          - Tier-1 packed index now holds **${REPO_COUNT}** repositories
          - \`pipeline/verify_catalog.py\` passed on the regenerated artefacts

          Merging deploys the refreshed catalog via \`deploy.yml\`.
          EOF
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "data: backfill catalog to ${REPO_COUNT} repositories" \
            --body-file pr_body.md || true
